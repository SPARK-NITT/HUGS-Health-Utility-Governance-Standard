control_id: HUGS-C001
title: "Patient-First Classification"
doctrine: "HUGS-D01"
obligation: "Policies, workflows, contracts, and automated systems must not reduce medically necessary care to an ordinary consumer transaction where doing so weakens clinical duties."
applies_to: [hospital, physician_practice, clinic, insurer, rehabilitation, telehealth, health_technology]
evidence_required:
  - policy
  - record
  - responsible_authority
severity: major
exceptions: []
remediation: "Document gap, assign responsible authority, create corrective action, and verify closure."
