control_id: HUGS-C009
title: "Care Gap Escalation"
doctrine: "HUGS-D07"
obligation: "Detected care gaps must automatically enter an escalation process rather than merely producing an administrative notification."
applies_to: [hospital, physician_practice, clinic, insurer, rehabilitation, telehealth, health_technology]
evidence_required:
  - policy
  - record
  - responsible_authority
severity: critical
exceptions: []
remediation: "Document gap, assign responsible authority, create corrective action, and verify closure."
